plugins {
    id 'fabric-loom' version '1.10.5' apply false
}

allprojects {
    group = rootProject.property('maven_group')
    version = rootProject.property('mod_version')

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://jitpack.io' }
    }
}

configure(project(':agent-core')) { sub ->
    sub.apply plugin: 'java'
    sub.java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }

    sub.tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }

    sub.tasks.withType(Test).configureEach {
        useJUnit()
        maxHeapSize = '1G'
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }

    sub.dependencies {
        testImplementation "junit:junit:${rootProject.property('junit_version')}"
        testImplementation "org.mockito:mockito-core:${rootProject.property('mockito_version')}"
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds agent-core, mod-common, and all MC version mods.'
    dependsOn ':agent-core:build', ':mod-common:build', ':mod-1.20.1:build', ':mod-1.20.4:build'
}

tasks.register('buildMods') {
    group = 'build'
    description = 'Builds every Minecraft version mod jar.'
    dependsOn ':mod-1.20.1:build', ':mod-1.20.4:build'
}
