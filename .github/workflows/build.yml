name: WorldSoul CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build agent-core
        run: ./gradlew :agent-core:build --no-daemon --stacktrace

      - name: Build Fabric mods (all MC versions)
        run: ./gradlew :mod-common:build buildMods --no-daemon --stacktrace

      - name: Upload Mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: WorldSoul-mods
          path: |
            mod-1.20.1/build/release/*.jar
            mod-1.20.4/build/release/*.jar
            mod-1.20.1/build/libs/*-1.0.0.jar
            mod-1.20.4/build/libs/*-1.0.0.jar
          retention-days: 7
          if-no-files-found: error

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Install WorldSoul Harness
        working-directory: worldsoul-harness
        run: pnpm install --frozen-lockfile

      - name: Test and build WorldSoul Harness
        working-directory: worldsoul-harness
        run: |
          pnpm exec vitest run packages/worldsoul/gateway/tests
          pnpm run build:lib

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Quality config present
        run: |
          test -f config/checkstyle/checkstyle.xml
          test -f config/pmd/ruleset.xml
          echo "Quality configs present (enforcement deferred until JDK/tooling aligned)."

  compatibility-check:
    name: Mod Metadata Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate fabric.mod.json (all versions)
        run: ./gradlew :mod-1.20.1:validateModMetadata :mod-1.20.4:validateModMetadata --no-daemon

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, code-quality, compatibility-check]
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release Archives
        run: |
          mkdir -p release
          cp artifacts/WorldSoul-mods/*.jar release/ 2>/dev/null || true
          cd release
          zip -r ../worldsoul-release.zip *.jar

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            worldsoul-release.zip
            release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
