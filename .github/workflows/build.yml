name: WorldSoul CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldsoul-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  NODE_VERSION: '24'

jobs:
  java-tests:
    name: Java tests and mod build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and test all Java modules
        run: ./gradlew :agent-core:build :mod-common:build buildMods --no-daemon --stacktrace
      - name: Validate Fabric metadata
        run: ./gradlew :mod-1.20.1:validateModMetadata :mod-1.20.4:validateModMetadata --no-daemon --stacktrace
      - name: Upload verified mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: worldsoul-mod-jars
          path: |
            mod-1.20.1/build/release/worldsoul-1.20.1.jar
            mod-1.20.4/build/release/worldsoul-1.20.4.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload Java test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/build/test-results/**'
          if-no-files-found: ignore

  harness-contract:
    name: Harness gateway contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        working-directory: worldsoul-harness
        run: pnpm install --frozen-lockfile
      - name: Run WorldSoul HTTP gateway contract tests
        working-directory: worldsoul-harness
        run: pnpm exec vitest run packages/worldsoul/gateway/tests
      - name: Build the Harness libraries
        working-directory: worldsoul-harness
        run: pnpm run build:lib

  fabric-runtime:
    name: Fabric ${{ matrix.minecraft }} dedicated-server smoke test
    needs: [java-tests, harness-contract]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.20.1
            project: mod-1.20.1
          - minecraft: 1.20.4
            project: mod-1.20.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Launch Fabric dedicated server and verify WorldSoul loads
        run: bash .github/scripts/verify-fabric-server.sh ${{ matrix.project }} ${{ matrix.minecraft }}
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.minecraft }}-server-log
          path: ${{ matrix.project }}/build/ci-server.log
          if-no-files-found: ignore

  release:
    name: Publish verified release assets
    needs: [java-tests, harness-contract, fabric-runtime]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worldsoul-mod-jars
          path: release
      - name: Package both verified mod JARs
        run: |
          cd release
          zip ../worldsoul-release.zip worldsoul-1.20.1.jar worldsoul-1.20.4.jar
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            worldsoul-release.zip
            release/worldsoul-1.20.1.jar
            release/worldsoul-1.20.4.jar
